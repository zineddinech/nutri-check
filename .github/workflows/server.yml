name: Server CI

on:
  # Déclenche le workflow sur les événements de push et de pull request
  push:
    branches:
      - main
      - 'feat/**'
      - dev
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'

jobs:
  # 1. LINT : Vérification du style et de la qualité du code
  lint_server:
    name: Lint Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installation de Poetry
        run: pip install poetry

      - name: Mise en cache venv et caches Poetry
        # Utilise le fichier lock/toml pour définir la clé de cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pypoetry
            server/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('server/poetry.lock', 'server/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Création de virtualenv et installation des dépendances
        working-directory: server # <--- CORRECTION ICI
        run: |
          # On vérifie .venv localement car on est dans le dossier server
          if [ ! -d ".venv" ]; then
            echo "Cache manqué. Création du venv et installation des dépendances..."
            poetry config virtualenvs.in-project true
            poetry install --no-interaction --no-ansi
          else
            echo "Cache venv trouvé. Installation complète ignorée."
          fi

      - name: Exécution des Linters (Black, Isort, Mypy)
        working-directory: server
        run: |
          # Activation explicite non nécessaire avec 'poetry run', mais conservée pour compatibilité
          . .venv/bin/activate
          poetry run black --check .
          poetry run isort --check-only .
          poetry run mypy app || true

  #---

  # 2. BUILD : Construction de l'environnement et/ou des artefacts
  build_server:
    name: Build Server
    runs-on: ubuntu-latest
    needs: [ lint_server ]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installation de Poetry
        run: pip install poetry

      - name: Restauration du Cache venv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pypoetry
            server/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('server/poetry.lock', 'server/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Création de virtualenv et installation des dépendances
        working-directory: server
        run: |
          if [ ! -d ".venv" ]; then
            echo "Cache manqué. Création du venv et installation des dépendances..."
            poetry config virtualenvs.in-project true
            poetry install --no-interaction --no-ansi
          else
            echo "Cache venv trouvé. Installation complète ignorée."
          fi

      - name: Construction des artefacts (si applicable)
        working-directory: server
        run: |
          . .venv/bin/activate
          echo "Construction du serveur terminée"

  #---

  # 3. TEST : Exécution des tests unitaires
  test_server:
    name: Test Server
    runs-on: ubuntu-latest
    needs: [ build_server ]
    if: always()

    # add MongoDB service
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Attendre que MongoDB soit prêt
        run: |
          echo "Waiting for MongoDB to be ready..."
          until nc -z 127.0.0.1 27017; do   
            sleep 1
          done
          echo "MongoDB is ready!"

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installation de Poetry
        run: pip install poetry

      - name: Restauration du Cache venv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pypoetry
            server/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('server/poetry.lock', 'server/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Création de virtualenv et installation des dépendances
        working-directory: server
        run: |
          if [ ! -d ".venv" ]; then
            echo "Cache manqué. Création du venv et installation des dépendances..."
            poetry config virtualenvs.in-project true
            poetry install --no-interaction --no-ansi
          else
            echo "Cache venv trouvé. Installation complète ignorée."
          fi

      - name: Exécution des Tests (Pytest)
        working-directory: server
        run: |
          # Exécute les tests et génère un rapport JUnit
          . .venv/bin/activate
          export PYTHONPATH="$PWD/.."
          # pytest sera maintenant trouvé car l'installation précédente a réussi
          poetry run pytest --junitxml=test-report.xml

      - name: Téléchargement du Rapport de Test (JUnit)
        if: always() # Toujours uploader le rapport, même si le job échoue
        uses: actions/upload-artifact@v4
        with:
          name: test-report-server
          path: server/test-report.xml
          retention-days: 15

  #---

  # 4. DEPLOY : Construction et déploiement de l'image Docker
  deploy_server:
    name: Deploy Server
    runs-on: ubuntu-latest
    needs: [ test_server ]
    # Le job s'exécute uniquement si le push est sur 'main' ET que test_server a réussi.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test_server.result == 'success'
    environment: production # Utilise un environnement GitHub
    steps:
      - uses: actions/checkout@v4

      # Les étapes suivantes sont répétées pour assurer un environnement propre pour le déploiement
      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installation de Poetry
        run: pip install poetry

      - name: Restauration du Cache venv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pypoetry
            server/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('server/poetry.lock', 'server/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Création de virtualenv et installation des dépendances
        working-directory: server
        run: |
          if [ ! -d ".venv" ]; then
            poetry config virtualenvs.in-project true
            poetry install --no-interaction --no-ansi
          fi

      - name: Construction et Push de l'image Docker
        env:
          # Utilisation des secrets pour l'authentification Docker
          DOCKERHUB_USER: ${{ secrets.DOCKER_HUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          SERVER_APP_NAME: ${{ secrets.SERVER_APP_NAME }}
        run: |
          # 1. Connexion à Docker Hub
          echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USER}" --password-stdin
          
          # 2. Lecture de la version depuis pyproject.toml
          # Utilisation de la version lue ou 'latest' par défaut
          APP_VERSION=v$(grep '^version =' server/pyproject.toml | awk -F'"' '{print $2}')
          IMAGE_TAG="${DOCKERHUB_USER}/${SERVER_APP_NAME}:${APP_VERSION}"
          
          echo "Déploiement du server version ${IMAGE_TAG}..."

          # 3. Construction et Push de l'image (avec le tag de version)
          docker build -t "$IMAGE_TAG" -f server/Dockerfile server/
          docker push "$IMAGE_TAG"
          
          # 4. Push avec le tag 'latest'
          docker tag "$IMAGE_TAG" "${DOCKERHUB_USER}/${SERVER_APP_NAME}:latest"
          docker push "${DOCKERHUB_USER}/${SERVER_APP_NAME}:latest"