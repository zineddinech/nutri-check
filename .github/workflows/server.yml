name: Server CI

on:
  # Déclenche le workflow sur les événements de push et de pull request
  push:
    branches:
      - main
      - 'feat/**'
      - dev
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'

jobs:
  # Ce job sert d'étape de 'build' et prépare l'environnement virtuel pour les jobs suivants
  lint_server:
    name: Lint Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installation de Poetry et des Dépendances
        working-directory: server
        run: |
          pip install poetry
          poetry config virtualenvs.in-project true
          poetry install

      - name: Exécution des Vérifications Lint (Black, Isort, Mypy)
        continue-on-error: true
        working-directory: server
        run: |
          poetry run black --check .
          poetry run isort --check-only .
          poetry run mypy app

  # ---

  setup_python:
    name: Build Server (Configuration Python/Venv)
    runs-on: ubuntu-latest
    needs: lint_server # Dépend du job de lint
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Restauration du Cache Poetry
        # Mise en cache des dépendances Poetry pour accélérer l'installation
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('server/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Installation de Poetry
        run: pip install poetry

      - name: Installation des Dépendances du Serveur
        working-directory: server
        run: |
          # Configure Poetry pour utiliser un .venv dans le répertoire du projet
          poetry config virtualenvs.in-project true
          poetry install

      - name: Téléchargement de l'Artefact d'Environnement Virtuel
        # Sauvegarde le .venv/ pour le job de test
        uses: actions/upload-artifact@v4
        with:
          name: server-venv
          path: server/.venv/
          retention-days: 1


  # ---

  test_server:
    name: Test Server
    runs-on: ubuntu-latest
    needs: setup_python # Dépend de la réussite de la construction/installation des dépendances
    steps:
      - uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installation de Poetry
        run: pip install poetry

      - name: Téléchargement de l'Artefact d'Environnement Virtuel
        # Récupère l'environnement virtuel pré-construit
        uses: actions/download-artifact@v4
        with:
          name: server-venv
          path: server/

      - name: Exécution des Tests Unitaires (Pytest)
        working-directory: server
        run: |
          # Ajoute le chemin du répertoire actuel au PYTHONPATH
          export PYTHONPATH="$PWD" 
          # Exécute les tests et génère un rapport JUnit
          poetry run pytest --junitxml=test-report.xml

      - name: Téléchargement du Rapport de Test (JUnit)
        uses: actions/upload-artifact@v4
        if: always() # Toujours uploader le rapport, même si le job échoue
        with:
          name: test-report-server
          path: server/test-report.xml
          retention-days: 15

  # ---

  deploy_server:
    name: Deploy Server
    runs-on: ubuntu-latest
    # Le job ne s'exécute que sur un push vers la branche par défaut (main)
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: test_server
    steps:
      - uses: actions/checkout@v4

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Déploiement Docker (Construire et Pousser)
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_HUB_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_HUB_TOKEN }}
          SERVER_APP_NAME: ${{ secrets.SERVER_APP_NAME }}
        run: |
          # 1. Connexion à Docker Hub
          echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin

          # 2. Lecture de la version depuis pyproject.toml
          APP_VERSION=v$(grep '^version =' server/pyproject.toml | awk -F'"' '{print $2}')
          IMAGE_TAG="${DOCKER_USERNAME}/${SERVER_APP_NAME}:${APP_VERSION}"
          
          echo "Déploiement du server version ${IMAGE_TAG}..."
          
          # 3. Construction et Push de l'image (avec le tag de version)
          docker build -t "$IMAGE_TAG" -f server/Dockerfile server/
          docker push "$IMAGE_TAG"

          # 4. Push avec le tag 'latest'
          docker tag "$IMAGE_TAG" "${DOCKER_USERNAME}/${SERVER_APP_NAME}:latest"
          docker push "${DOCKER_USERNAME}/${SERVER_APP_NAME}:latest"