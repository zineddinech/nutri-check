<svg width="530" height="500" viewBox="0 0 800 750" xmlns="http://www.w3.org/2000/svg" style="background:#FFFFFF;">
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#333333" />
        </marker>
    </defs>

    <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#000">UC-06: Generate Personalized AI Recipe</text>

    <circle cx="400" cy="80" r="15" fill="#333333" />

    <line x1="400" y1="95" x2="400" y2="130" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)" />

    <rect x="200" y="130" width="400" height="50" rx="10" ry="10" fill="#f0f0f0" stroke="#333333" stroke-width="1.5" />
    <text x="400" y="160" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#000">User inputs description &amp; clicks "Analyze Recipe"</text>

    <line x1="400" y1="180" x2="400" y2="220" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)" />

    <rect x="200" y="220" width="400" height="50" rx="10" ry="10" fill="#f0f0f0" stroke="#333333" stroke-width="1.5" />
    <text x="400" y="242" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#000">System retrieves User Profile (Allergens/Diet)</text>
    <text x="400" y="258" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#000">&amp; Sends prompt to AI</text>

    <line x1="400" y1="270" x2="400" y2="310" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)" />

    <polygon points="400,310 550,350 400,390 250,350" fill="#f0f0f0" stroke="#333333" stroke-width="1.5" />
    <text x="400" y="345" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#000">AI Generation</text>
    <text x="400" y="360" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#000">Successful?</text>

    <text x="210" y="340" font-family="Arial, sans-serif" font-size="12" fill="#000">No (Policy/Error)</text>
    <line x1="250" y1="350" x2="150" y2="350" stroke="#333333" stroke-width="2" />
    <line x1="150" y1="350" x2="150" y2="420" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)" />

    <rect x="50" y="420" width="200" height="50" rx="10" ry="10" fill="#f0f0f0" stroke="#333333" stroke-width="1.5" />
    <text x="150" y="450" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#000">Display Error/Warning</text>

    <text x="560" y="340" font-family="Arial, sans-serif" font-size="12" fill="#000">Yes</text>
    <line x1="550" y1="350" x2="650" y2="350" stroke="#333333" stroke-width="2" />
    <line x1="650" y1="350" x2="650" y2="420" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)" />

    <rect x="550" y="420" width="200" height="50" rx="10" ry="10" fill="#f0f0f0" stroke="#333333" stroke-width="1.5" />
    <text x="650" y="450" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#000">Receive Recipe JSON</text>

    <line x1="650" y1="470" x2="650" y2="510" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)" />

    <rect x="525" y="510" width="250" height="50" rx="10" ry="10" fill="#f0f0f0" stroke="#333333" stroke-width="1.5" />
    <text x="650" y="532" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#000">Display Ingredients, Steps</text>
    <text x="650" y="550" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#000">&amp; Calories</text>

    <polygon points="400,600 420,620 400,640 380,620" fill="#f0f0f0" stroke="#333333" stroke-width="1.5" />

    <line x1="150" y1="470" x2="150" y2="620" stroke="#333333" stroke-width="2" />
    <line x1="150" y1="620" x2="380" y2="620" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)" />

    <line x1="650" y1="560" x2="650" y2="620" stroke="#333333" stroke-width="2" />
    <line x1="650" y1="620" x2="420" y2="620" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)" />

    <line x1="400" y1="640" x2="400" y2="665" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)" />

    <circle cx="400" cy="680" r="15" fill="#333333" />
    <circle cx="400" cy="680" r="20" fill="none" stroke="#333333" stroke-width="2" />

</svg>